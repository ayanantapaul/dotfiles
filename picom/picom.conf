# --- Backend ---
backend = "glx";
vsync = true;

# Enable global Animations

# --- Fading Configuration ---
fading = true;
fade-delta = 4; # the time between steps in a fade (in milliseconds). lower = smoother/faster
fade-in-step = 0.03; # opacity change per step while fading in (0.01 - 1.0)
# Opacity change per step while fading out (0.01 - 1.0).
fade-out-step = 0.03;
# Do not fade windows when they open or close (keeps workspace switching clean)
no-fading-openclose = false;

# --- Disable modern tag animations if present ---
animations = true;
# Opacity of active windows (1.0 is completely solid)
active-opacity = 0.925
# Opacity of inactive windows (e.g., 0.85 means 15% transparent)
inactive-opacity = 0.80;
# Let the window manager focus control opacity
frame-opacity = 1.0;
 
